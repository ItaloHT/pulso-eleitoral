name: Monitorar pesquisas eleitorais
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar novas fontes e registrar para validação
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/discover_polls.py
